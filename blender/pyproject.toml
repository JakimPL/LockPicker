[project]
name = "locksmith"
version = "0.1.0"
description = "Procedural Blender builder for the LockPicker workshop scene"
requires-python = ">=3.13,<3.14"
dependencies = [
    "bpy==5.2.0",
    "numpy>=1.26,<3",
    "pydantic>=2.7,<3",
    "PyYAML>=6.0,<7",
]

[project.scripts]
locksmith = "locksmith.__main__:main"

[dependency-groups]
dev = ["pylint>=4.0"]
typecheck = [
    "mypy>=2.1",
    "fake-bpy-module==20260501",
    "types-PyYAML>=6.0.12",
    "numpy>=1.26,<3",
    "pydantic>=2.7,<3",
]

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["locksmith"]

[tool.black]
line-length = 120
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 120
known_first_party = ["paths", "locksmith"]
src_paths = ["src"]

[tool.mypy]
python_version = "3.13"
strict = true
disallow_any_explicit = true
enable_error_code = ["ignore-without-code"]
plugins = ["pydantic.mypy"]
mypy_path = "src"
explicit_package_bases = true
files = ["src/paths.py", "src/locksmith"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pylint.main]
py-version = "3.13"
ignored-modules = ["bpy", "bpy.types", "bpy.ops", "bmesh", "bmesh.types", "bmesh.ops", "mathutils"]

[tool.pylint."messages control"]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "line-too-long",
    "wrong-import-order",
    "ungrouped-imports",
    "too-few-public-methods",
]

[tool.pylint.basic]
good-names = ["x", "y", "z"]

[tool.pylint.design]
max-args = 8
max-positional-arguments = 4
max-locals = 25
max-attributes = 14

[tool.pylint.similarities]
min-similarity-lines = 10
