screen:
  width: 1000
  height: 800

display:
  width: 1000
  height: 800
  fullscreen: false

layout:
  x_offset: 150
  bar_width: 80
  bar_offset: 5
  bar_y_offset: 5

pick:
  size: 20
  offset: 20
  width: 6
  idle_offset: 80
  discrepancy: 40
  shapes:
    - diamond
    - circle

arrow:
  size: 16
  width: 2

color:
  highlight: [255, 255, 255]
  background: [32, 32, 32]
  border: [13, 12, 11]
  post_release: [104, 92, 72]
  arrow: [192, 128, 128]
  tumblers:
    - [128, 128, 128]
    - [192, 192, 64]
    - [192, 64, 64]
  picks:
    - [192, 208, 192]
    - [208, 192, 192]

alpha:
  opaque: 255
  dimmed: 160
  faint: 112
  jam_divisor: 3

animation:
  speed: 0.05
  pick_travel: 2.0
  fps: 60

rules:
  default_number_of_picks: 2
  default_max_height: 11
  min_number_of_picks: 1
  min_max_height: 3

simulation:
  games: 1000
  max_moves: 100

theme:
  mode: styled
  name: workshop
  directory: assets/themes
  highlight_tint: [72, 48, 24]
  jam_tint: [128, 122, 134]
  shadow_alpha: 160
  badge_alpha: 255
