[project]
name = "lockpicker"
version = "0.1.0"
description = "Lock Picker - a simple quasi-lock picking logic puzzle game"
readme = "README.md"
requires-python = ">=3.13,<3.14"
authors = [{ name = "Jakim" }]
dependencies = [
    "bpy==5.2.0",
    "msgpack==1.2.1",
    "numpy>=1.26,<3",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "pygame==2.6.1",
    "pyyaml==6.0.3",
    "tqdm==4.68.4",
]

[project.scripts]
lockpicker = "lockpicker.__main__:main"
locksmith = "locksmith.__main__:main"

[dependency-groups]
dev = [
    "black==26.5.1",
    "isort==8.0.1",
    "mypy==2.1.0",
    "pre-commit==4.6.0",
    "pylint==4.0.6",
    "pylint-pydantic==0.4.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-xdist==3.8.0",
    "types-PyYAML==6.0.12.20260518",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lockpicker", "src/locksmith"]

[tool.black]
line-length = 120
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 120
known_first_party = ["lockpicker"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib --cov"
pythonpath = ["src", "."]

[tool.coverage.run]
source = ["src/lockpicker"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.mypy]
files = ["src/lockpicker", "src/locksmith"]
exclude = ["tests"]
plugins = ["pydantic.mypy"]
disallow_subclassing_any = true
ignore_missing_imports = true
strict = true
python_version = "3.13"

[[tool.mypy.overrides]]
module = "locksmith.*"
disallow_any_explicit = true
enable_error_code = ["ignore-without-code"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pylint.main]
py-version = "3.13"
ignored-modules = [
    "bpy",
    "bpy.types",
    "bpy.ops",
    "bmesh",
    "bmesh.types",
    "bmesh.ops",
    "mathutils",
]

[tool.pylint."messages control"]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "line-too-long",
    "wrong-import-order",
    "ungrouped-imports",
    "too-few-public-methods",
]

[tool.pylint.basic]
good-names = ["x", "y", "z"]

[tool.pylint.design]
max-args = 9
max-positional-arguments = 4
max-locals = 25
max-attributes = 19

[tool.pylint.similarities]
min-similarity-lines = 10
